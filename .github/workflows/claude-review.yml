name: Claude PR Review

# Gated on CI (ci.yml, name: "CI" — must match exactly) having already
# succeeded, so review cost is never spent on a PR that doesn't even pass
# the free, deterministic checks. workflow_run fires once ci.yml finishes,
# regardless of conclusion — the actual pass/fail gate is the job-level
# `if:` below, not the trigger itself.
#
# IMPORTANT, verified via GitHub's own docs (not assumed): "This trigger
# only receives events when the workflow file is on the default branch" —
# this file's workflow_run trigger is inert on any branch other than
# master. Pushing this to a feature branch changes nothing until it's
# merged; only master's copy of this file is ever consulted to decide
# whether to fire.
#
# `pull_request`/`pull_request_target` both fire on direct pushes to
# master via ci.yml's OWN `push: branches: [master]` trigger too, but that
# run's `github.event.workflow_run.event` will be "push", not
# "pull_request" — the job-level `if:` below excludes it, so a direct
# commit to master still can't cause a review to run (verified logically:
# the only way `event == 'pull_request'` is true is if ci.yml itself was
# triggered by a pull_request event).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# One run per PR at a time. Keyed off the PR number resolved from the
# workflow_run payload (see the job-level `if:` below for why this can be
# empty/null for some events — concurrency.group tolerates that; an empty
# group name here is harmless since the job itself won't run in that case).
concurrency:
  group: claude-review-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: true

# Minimal set, matching the worked review-workflow example at
# code.claude.com/docs/en/github-actions (fetched 2026-09-29) exactly:
# contents/pull-requests/issues all read-only, id-token:write for the
# action's GitHub-App OIDC auth (it posts comments as the Claude GitHub App
# via its own separately-scoped token, not this workflow's GITHUB_TOKEN —
# that's why pull-requests:write is NOT needed here even though the job
# posts PR comments). Note: this is narrower than one of the action repo's
# own example workflows (examples/pr-review-comprehensive.yml), which grants
# pull-requests:write — chose the docs page's version deliberately since
# it's what this task named as authoritative and it's the more minimal of
# the two ("nothing broader" per the task).
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

jobs:
  review:
    # Four independent conditions, all required:
    #
    # 1. conclusion == 'success' — ci.yml (lint/tsc/test/build) actually
    #    passed. This is the whole point of the change: no review spend on
    #    a PR that doesn't even pass the free, deterministic checks.
    # 2. event == 'pull_request' — ci.yml was triggered by a PR, not by
    #    ci.yml's own `push: branches: [master]` trigger firing on a direct
    #    commit to master. (workflow_run's payload has no
    #    github.event.pull_request the way a plain pull_request trigger
    #    does — github.event.workflow_run.event is what carries this.)
    # 3. pull_requests[0] != null — GitHub's own documented caveat: the
    #    workflow_run payload's `pull_requests` array is empty for a PR
    #    from a forked repository (and for an already-merged PR). Without
    #    this guard, PR NUMBER below would silently resolve to nothing.
    # 4. head_repository == repository — same-repo-only, the actual
    #    security-critical guard. workflow_run (unlike plain pull_request)
    #    always runs with this repo's real secrets/OIDC federation
    #    available, REGARDLESS of whether the underlying PR came from a
    #    fork — GitHub does not withhold anything here the way it does for
    #    a fork's own pull_request-triggered run. Checking out an
    #    arbitrary fork's head_sha under a privileged, secret-bearing
    #    context is the textbook "pwn request" pattern (same class of risk
    #    pull_request_target has, and exactly what the original design of
    #    this file avoided by using plain pull_request in the first
    #    place). This repo is public (confirmed via the GitHub API), so
    #    this isn't a hypothetical — this condition is what keeps a fork
    #    PR from ever reaching the checkout step below at all.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null &&
      github.event.workflow_run.head_repository.full_name == github.event.workflow_run.repository.full_name
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # workflow_run has no direct PR checkout context the way pull_request
      # does — `ref` must be set explicitly. head_sha (not
      # pull_requests[0].head.sha) is the documented field for this: it's a
      # required, always-populated top-level field on the workflow_run
      # object (unlike pull_requests, which can be null/empty), and it's
      # exactly the commit ci.yml validated. Safe to check out here
      # specifically because the job-level `if:` above already confirmed
      # head_repository == repository (same-repo only) before this step
      # ever runs — see that comment for the full reasoning.
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      # Pinned to the commit the `v1` tag currently resolves to, verified
      # against the real repo (not guessed) via two independent lookups on
      # 2026-09-29: `git ls-remote --tags` and the GitHub API's tag-object
      # resolution both agree this is also exactly what the `v1.0.236`
      # release tag points to (published 2026-09-28, the latest release at
      # verification time). Re-verify before bumping — `v1` is a moving
      # tag, this SHA is not.
      - name: Claude review
        id: claude-review
        uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829 # v1.0.236 (tag "v1" at 2026-09-29)
        with:
          # Workload identity federation, not a static API key — these
          # three are identifiers (an OIDC federation rule, an Anthropic
          # organization UUID, a service account ID), not secrets, so they
          # commit as plain values rather than ${{ secrets.… }}. The
          # federation rule + issuer are already registered on the
          # Anthropic side (Claude Console → Settings → Workload identity);
          # id-token: write above (already present for this exact reason)
          # is what lets this workflow's GitHub OIDC token get exchanged
          # for Claude API access. No anthropic_api_key/claude_code_oauth_token
          # anywhere in this file — either one present alongside these
          # federation inputs takes precedence and silently disables
          # federation, so it must be absent, not just commented out.
          anthropic_federation_rule_id: fdrl_01Fu4dfq5XbmAzpz9s2oV38i
          anthropic_organization_id: 012aa2d3-36cf-46ba-aec7-585d919e8331
          anthropic_service_account_id: svac_01NdfXhijCba7BmwXmtWLBj9
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}

            Review this pull request. Get the full diff with `gh pr diff`
            and inspect any changed file's full content with Read when the
            diff alone doesn't give enough context (e.g. to see whether a
            surrounding null-check already exists).

            This is a Next.js 16 / Prisma 7 / MySQL app (backgammon match
            analysis, synced from a third-party API called "Galaxy") being
            prepared for a read-only Vercel deployment. Beyond general code
            quality, specifically check for these known failure classes —
            each has a typical severity, decided here so severity isn't
            left to case-by-case judgment:

            - **Secrets or credentials in the diff** (API keys, bearer
              tokens, passwords, real DB connection strings) — always
              HIGH severity. Confidence HIGH whenever the pattern is
              unambiguous (a literal high-entropy string assigned to
              something named token/password/key/secret, or a real value
              that belongs only in a gitignored .env file appearing in
              tracked, non-example code).
            - **Galaxy-payload assumptions**: treating a field from the
              Galaxy API as always present/non-null without a guard —
              especially `metadata.scores` (null for money games),
              `metadata.timestamp`, `count_as_decision`, or conflating
              `source_position` with `destination_position` — or handling
              `analysed_event` with a binary move/cube split instead of an
              exhaustive per-shape mapping (this project has a documented
              history of exactly this bug class crashing real ingestion).
              HIGH if it could crash ingest/sync or silently miscount a
              graded decision (PR/mistake stats depend on this); MEDIUM if
              it's a defensive-coding gap unlikely to be hit given
              currently-observed data shapes.
            - **Unindexed `Decision` queries**: a new query filtering or
              sorting on the `Decision` table (1M+ rows) without an index
              covering the added predicate. MEDIUM by default; HIGH if it's
              the same access pattern (plyNumber / countAsDecision /
              classification / errorSeverity / kind) this project has
              already measured as a full-table-scan at its current scale
              (documented: 10+ seconds locally, 1-2+ seconds on the
              production DB, before the existing index fix).
            - **Credential-scoping violations**: using the read-write
              Prisma client where the read-only one would suffice, or any
              change that could weaken the Galaxy-gate's fail-closed
              guarantee (lib/galaxyGate.ts's isGalaxyEnabled() must require
              BOTH DATABASE_URL present AND ENABLE_WRITE_MODE === "true" —
              flag an `&&` weakened to `||`, a default-to-enabled fallback,
              or a check that only tests one condition). Always HIGH — this
              app is specifically designed to deploy as a read-only,
              gated viewer, and this class of bug undermines that directly.
            - **Missing collation pin**: a new column storing an
              externally-sourced string identifier (a Galaxy user/match/
              event ID or similar) added without hand-editing the migration
              SQL to add `COLLATE utf8mb4_bin` (Prisma's schema DSL can't
              express this — see docs/field-mapping.md). HIGH — silent,
              hard-to-detect-later data integrity bug (case-insensitive
              collisions on what should be exact-match identifiers).
            - **Inline Tailwind literals**: a `className="..."` string
              literal or hand-rolled template literal on a component that
              already has a `.styles.ts` file (see
              .claude/skills/styling-conventions/SKILL.md), instead of
              extending it. LOW — a style-convention gap, not a functional
              bug; this project's own convention explicitly allows gradual,
              not-all-at-once adoption, so don't flag components that have
              never been touched under the convention at all.
            - **Unexplained visual-baseline changes**: a file under
              `e2e/board-visual.spec.ts-snapshots/` changed with nothing in
              the PR (diff or description) explaining what rendering change
              caused it. MEDIUM by default (could be a legitimate,
              intentional UI change); raise to HIGH only if the diff shows
              no plausible rendering-affecting code change anywhere in the
              same PR that would explain a pixel difference at all.
            - **Server-only imports leaking into a client bundle**: a file
              marked `"use client"` (or something it imports) pulling in
              lib/prisma.ts, lib/ingest.ts, lib/sync.ts, lib/galaxy-client.ts,
              or any other server-only/`node:*`-using module. HIGH — this
              either breaks the build or leaks server-side code/credentials
              into a bundle actually shipped to the browser.

            For confidence: HIGH means you can point to the exact
            file/line and explain precisely why it's wrong. MEDIUM means a
            plausible concern you can't fully verify from what's visible in
            the diff alone (e.g. you can't see a guard defined elsewhere in
            the same file). LOW means a speculative, pattern-matched
            concern flagged just in case, not a confirmed problem.

            Post your findings as PR comments: use the inline-comment tool
            for each specific issue, on the exact line it applies to, and
            one top-level comment summarizing the review (including a
            short note if you found nothing). For every finding, the
            `possible_solution` you give — both in the comment and in the
            structured output below — must describe the fix in words. Never
            write or paste an actual code diff, patch, or replacement
            snippet; you're suggesting a direction, not authoring the fix.

            Finally, return the full list of findings as structured output
            matching the schema below — every issue you commented on, with
            the same reason/severity/confidence/possible_solution, so a
            separate step can apply a pass/fail threshold. Return an empty
            findings array if you found nothing.
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","properties":{"findings":{"type":"array","items":{"type":"object","properties":{"reason":{"type":"string","description":"What the problem is and why it matters, referencing the specific file/line/pattern"},"severity":{"type":"string","enum":["low","medium","high"]},"confidence":{"type":"string","enum":["low","medium","high"]},"possible_solution":{"type":"string","description":"A description of how to fix it in words — never a code diff or patch"}},"required":["reason","severity","confidence","possible_solution"]}}},"required":["findings"]}'

      # The actual pass/fail decision — real parsing logic below, not "the
      # AI decides". Rule: fail only when at least one finding has
      # severity == "high" AND confidence != "low". Every other case
      # (low/medium severity regardless of confidence, or any severity at
      # low confidence) already got posted as a PR comment above by
      # Claude itself and just passes here.
      - name: Enforce severity gate
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude-review.outputs.structured_output }}
        run: |
          set -euo pipefail

          if [ -z "${STRUCTURED_OUTPUT:-}" ]; then
            echo "::error::No structured_output from the Claude review step — the review likely errored or was skipped. Treating as a failure rather than silently passing unreviewed code."
            exit 1
          fi

          if ! echo "$STRUCTURED_OUTPUT" | jq -e '.findings | type == "array"' > /dev/null 2>&1; then
            echo "::error::structured_output didn't match the expected shape (missing/invalid \"findings\" array). Raw output:"
            echo "$STRUCTURED_OUTPUT"
            exit 1
          fi

          echo "All findings:"
          echo "$STRUCTURED_OUTPUT" | jq '.findings'

          BLOCKING=$(echo "$STRUCTURED_OUTPUT" | jq '[.findings[] | select(.severity == "high" and .confidence != "low")]')
          BLOCKING_COUNT=$(echo "$BLOCKING" | jq 'length')

          if [ "$BLOCKING_COUNT" -gt 0 ]; then
            echo "::error::$BLOCKING_COUNT blocking finding(s): severity=high with confidence != low."
            echo "$BLOCKING" | jq -c '.[]'
            exit 1
          fi

          echo "No blocking findings (nothing at severity=high with confidence!=low). Any lower-severity or low-confidence findings were posted as comments only; job passes."
