name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    # Deliberately no DATABASE_URL / DATABASE_URL_READONLY here, not even a
    # dummy value. lib/prisma.ts's clients are lazy (see the comment there) —
    # importing the module, and running a full `next build`, must succeed
    # with zero DB env vars set at all (confirmed locally in the same
    # session this workflow was added: a clean checkout with no .env file
    # and no DB env vars present built cleanly). Leaving this genuinely
    # unset, rather than papering over it with a fake value, makes this
    # workflow itself the regression test for that property — if a future
    # change reintroduces an eager, import-time DB requirement, this build
    # step fails loudly instead of silently passing on a masked dummy value.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # app/layout.tsx (and any other route using typed-route helpers like
      # LayoutProps<...>) depends on ambient types Next writes to
      # .next/types/** as a side effect of `next build`/`next dev` — they
      # don't exist on a fresh checkout until one of those has run. Without
      # this, `npx tsc --noEmit` below fails with "Cannot find name
      # 'LayoutProps'" even though the code is correct — reproduced directly
      # against master before fixing, not guessed. `next typegen` generates
      # exactly those types (nothing else — no bundling, no static
      # generation) in well under a second, so this runs before the
      # standalone typecheck instead of a full `npm run build` (which would
      # also unblock it, just ~2 orders of magnitude slower for a step whose
      # only job here is making a type available).
      - run: npx next typegen

      # Kept as its own step even though the later `npm run build` also runs
      # a full internal typecheck: Next's build-time check only covers files
      # actually reachable from a route/page's import graph, so a `.ts` file
      # nothing imports yet (e.g. a new lib/ helper added ahead of wiring it
      # up) would silently skip Next's check but still get caught here,
      # since tsconfig.json's `include` covers the whole project regardless
      # of what's wired into a route.
      - run: npx tsc --noEmit

      - run: npm test

      - run: npm run build

      # npm run test:visual (the Playwright visual-regression suite) is
      # intentionally NOT run here — it needs a seeded local MySQL schema
      # (bg_test, see .env.test/e2e/README.md) that doesn't exist in this
      # runner, and its own GPU-rasterization jitter (documented in
      # playwright.config.ts/e2e/README.md, mitigated locally by retries)
      # makes it a poor fit for CI. It stays a local-only check.
